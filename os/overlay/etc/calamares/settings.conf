---
modules-search: [local]
branding: dell
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
sequence:
 - show: [welcome, locale, keyboard, partition, users, summary]
 - exec: [partition, mount, unpackfs, machineid, fstab, locale, keyboard, localecfg, users, shellprocess, displaymanager, networkcfg, hwclock, packages, initramfs, grubcfg, bootloader, umount]
 - show: [finished]
