set timeout=8
set default=0
set menu_color_normal=light-gray/black
set menu_color_highlight=black/yellow
if [ "$grub_platform" = "efi" ]; then
 insmod efi_gop
else
 insmod vbe
fi
insmod all_video
terminal_output gfxterm
menuentry 'Dell OS 0.1 - Experimentar ou instalar' {
 linux /live/vmlinuz boot=live components username=live hostname=dell-os locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo live-config.nottyautologin dell.smoketest console=tty0 console=ttyS0,115200n8
 initrd /live/initrd.img
}
menuentry 'Dell OS 0.1 - Video seguro' {
 linux /live/vmlinuz boot=live components username=live hostname=dell-os locales=pt_BR.UTF-8 keyboard-layouts=br nomodeset dell.smoketest console=tty0 console=ttyS0,115200n8
 initrd /live/initrd.img
}
menuentry 'Reiniciar' { reboot }
menuentry 'Desligar' { halt }
